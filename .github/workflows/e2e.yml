name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - pyproject.toml
      - uv.lock
      - .github/workflows/e2e.yml
      - .github/workflows/bug-checker.yml # the pinned bot version
      - .github/bug-checker.yml
  schedule:
    - cron: "47 3 * * 1" # weekly, 30 min after bug-checker.yml warms the model cache

permissions:
  contents: read

# Runs share the sandbox's issues: one at a time, none cut short mid-test.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check

      # Issues must be filed with a user's token: GITHUB_TOKEN's events start no
      # workflows, so the bot would never see them. Fine-grained PAT, this repository
      # only: Issues read and write.
      - name: Test
        run: uv run --no-sync pytest -v
        env:
          E2E_TOKEN: ${{ secrets.E2E_TOKEN }}
