name: Bug report check

on:
  issues:
    types: [opened, edited, labeled, unlabeled, typed, untyped, reopened]
  # Issue runs only read the Actions cache; these trusted events fill it with the model.
  push:
    branches: [main]
    paths: [.github/workflows/bug-checker.yml]
  schedule:
    - cron: "17 3 * * 1" # weekly, before the cache's 7-day eviction
  workflow_dispatch:

permissions:
  contents: read # the config, .github/bug-checker.yml
  issues: write # the comment

# A label that is neither bug nor a status (e2e, duplicate, ...) changes nothing the
# bot checks, so its event is skipped. Keep the list in step with status_labels in
# .github/bug-checker.yml; contains() ignores case.
# Edits in a row: only the last check runs to the end. A skipped event gets a group
# of its own: in the issue's group it would cancel the checks it does not replace.
concurrency:
  group: >-
    bug-checker-${{ github.event.issue.number || github.ref }}${{
    contains(fromJSON('["labeled", "unlabeled"]'), github.event.action)
    && !contains(fromJSON('["bug", "Submitted", "Open", "In Progress"]'),
    github.event.label.name) && format('-skip-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action)
      || contains(fromJSON('["bug", "Submitted", "Open", "In Progress"]'),
      github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: maksimTrs/bug-report-checker@d610bc578fd19aac75022ca405dbcbf55bc6e0c5 # v1
