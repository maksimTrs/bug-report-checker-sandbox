name: Bug report check

on:
  issues:
    types: [opened, edited, labeled, unlabeled, typed, untyped, reopened]
  # Issue runs only read the Actions cache; these trusted events fill it with the model.
  push:
    branches: [main]
    paths: [.github/workflows/bug-checker.yml]
  schedule:
    - cron: "17 3 * * 1" # weekly, before the cache's 7-day eviction
  workflow_dispatch:

permissions:
  contents: read # the config, .github/bug-checker.yml
  issues: write # the comment

# Edits in a row: only the last check runs to the end.
concurrency:
  group: bug-checker-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A label that is neither bug nor a status (e2e, duplicate, ...) changes nothing
    # the bot checks: skip it before a runner starts. Keep the list in step with
    # status_labels in .github/bug-checker.yml; contains() ignores case.
    if: >-
      !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action)
      || contains(fromJSON('["bug", "Submitted", "Open", "In Progress"]'),
      github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: maksimTrs/bug-report-checker@5bb01a1347f2986a2c2bebf31a34c91b52f42004
